<!DOCTYPE html>
<html lang="en">
<head>
<!--
  ==========================================================================
  MORNING ROUTINE — testable mockup
  TARGET: original iPad Air (2013), iOS 12.5.8, Safari, landscape 1024x768.
  This Safari is from 2018. DO NOT REINTRODUCE:
    - optional chaining (?.), nullish coalescing (??), logical assignment (||=)
    - Array.flat / flatMap, Object.fromEntries, String.replaceAll
    - top-level await, dynamic import(), ResizeObserver, IntersectionObserver
    - flexbox `gap` (grid-gap is fine; otherwise use margins)
    - CSS aspect-ratio, :is(), :where(), inset, nested clamp()
    - HTML5 drag-and-drop API (dead on iOS touch)
    - var() inside SVG presentation attributes (use style="stroke:var(--x)")
  ES2017 ceiling. const/let, arrow fns, template literals, promises,
  async/await, flexbox, CSS grid, CSS custom properties are all safe.
  All localStorage access is wrapped in try/catch (throws in private browsing).
  No external requests: system fonts + inline SVG only.
  No failure states, no scores, no streaks, no sound. Ever.

  LOOK: warm cream ground, the step lifted onto a soft card, one filled pill
  as the obvious tap. ?theme=sand|sage|blue|lilac|pink previews a theme without
  persisting it.
  ==========================================================================
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Morning</title>
<style>
  .t-sand  { --bg:#e9dfd1; --surface:#f6f1e8; --ink:#4a4034; --soft:#8a7e6c; --line:#d8cbb8; --accent:#a9805f; --accent-soft:#e0cdba; }
  .t-sage  { --bg:#dde4db; --surface:#eff3ec; --ink:#3b473c; --soft:#78876f; --line:#c8d3c4; --accent:#6f8d6c; --accent-soft:#c9d8c5; }
  .t-blue  { --bg:#dbe3e9; --surface:#eef2f7; --ink:#35414a; --soft:#73858f; --line:#c4d0d9; --accent:#6c8ba2; --accent-soft:#c6d6e1; }
  .t-lilac { --bg:#e4dfe9; --surface:#f2eef6; --ink:#413a4a; --soft:#7e7689; --line:#d1c9d9; --accent:#867aa0; --accent-soft:#d6cfe2; }
  .t-pink  { --bg:#e9dbdf; --surface:#f6eef0; --ink:#4a3a40; --soft:#8d7079; --line:#dac6cc; --accent:#b17f90; --accent-soft:#e3cbd3; }

  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-touch-callout: none;
  }
  #app { position:fixed; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; }
  button, input { font-family: inherit; color: inherit; -webkit-appearance: none; appearance: none; border-radius:0; }
  button { background: transparent; border: 0; padding: 0; cursor: pointer; }
  svg { display:block; }

  /* ---------- ambient time bar ---------- */
  .ambient { height:58px; padding:22px 30px 0 30px; display:flex; flex-direction:row; align-items:center; box-sizing:border-box; }
  .track { flex:1 1 auto; height:10px; border-radius:5px; background: var(--line); position:relative; overflow:hidden; }
  .fill { position:absolute; top:0; right:0; bottom:0; width:100%; border-radius:5px;
          background: var(--accent-soft); transition: width 280ms linear; }
  .door { width:34px; margin-left:16px; color: var(--soft); flex:0 0 auto; }

  /* ---------- stage ---------- */
  .stage { flex:1 1 auto; position:relative; opacity:1; transition: opacity 240ms ease; }
  .pane { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; }
  .card { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* step illustration: pastel medallion + two-tone line art */
  .medallion { flex:0 0 auto; display:flex; align-items:center; justify-content:center;
               background: var(--tint); }
  .art { color: var(--soft); }

  .steplabel { flex:0 0 auto; font-weight:600; letter-spacing:-0.4px; text-align:center; }
  .done { flex:0 0 auto; font-weight:600; letter-spacing:0.2px;
          display:flex; align-items:center; justify-content:center;
          transition: opacity 180ms ease, transform 180ms ease; }
  .done:active { opacity:.72; transform: scale(.985); }
  .park { flex:0 0 auto; min-width:340px; height:88px; padding:0 34px; margin-top:16px; border-radius:44px;
          color: var(--soft); font-size:26px; box-shadow: inset 0 0 0 2px var(--line);
          display:flex; align-items:center; justify-content:center; }
  .park:active { opacity:.6; }
  .next { flex:0 0 auto; color: var(--soft); font-size:25px; margin-top:18px; height:30px; }

  /* ---------- dots + chrome ---------- */
  .footer { height:104px; position:relative; display:flex; flex-direction:row; align-items:center; justify-content:center; }
  .dot { width:18px; height:18px; border-radius:9px; margin:0 11px; box-shadow: inset 0 0 0 2px var(--line); }
  .dot.on { background: var(--accent); box-shadow:none; }
  .dot.here { box-shadow: inset 0 0 0 2px var(--soft); }
  .seeall { position:absolute; right:16px; top:8px; width:150px; height:88px; border-radius:44px;
            color: var(--soft); font-size:24px; display:flex; align-items:center; justify-content:center; }
  .seeall:active { opacity:.6; }
  .parentbtn { position:absolute; left:16px; top:8px; width:190px; height:88px; border-radius:44px;
               color: var(--soft); font-size:24px; display:flex; align-items:center; justify-content:center; }
  .parentbtn:active { opacity:.6; }

  /* ---------- overview / reorder ---------- */
  .sheet { position:fixed; top:0; left:0; right:0; bottom:0; background: var(--bg);
           display:flex; flex-direction:column; padding:24px 60px 24px 34px; box-sizing:border-box; }
  .sheettitle { flex:0 0 auto; font-size:34px; font-weight:600; margin:0 0 14px 0; }
  .rows { flex:1 1 auto; }
  .row { height:88px; margin-bottom:4px; border-radius:24px; background: var(--surface);
         display:grid; grid-template-columns: 76px 1fr 88px 88px; grid-gap:8px; align-items:center;
         padding:0 18px 0 14px; box-sizing:border-box; }
  .rowart { width:60px; height:60px; border-radius:30px; background: var(--tint);
            display:flex; align-items:center; justify-content:center; }
  .rowart .art { width:44px; height:44px; }
  .row .rl { font-size:31px; }
  .row.isdone .rl { color: var(--soft); }
  .arrow { width:88px; height:88px; color: var(--soft); display:flex; align-items:center; justify-content:center; }
  .arrow:active { opacity:.5; }
  .arrow[disabled] { opacity:.22; }
  .tick { color: var(--accent); }
  .sheetfoot { flex:0 0 auto; display:flex; flex-direction:row; align-items:center; justify-content:space-between; margin-top:12px; }
  .themes { display:flex; flex-direction:row; }
  .sw { width:88px; height:88px; border-radius:44px; margin-right:12px; display:flex; align-items:center; justify-content:center; }
  .sw i { display:block; width:52px; height:52px; border-radius:26px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.09); }
  .sw.sel { box-shadow: inset 0 0 0 3px var(--soft); }
  .big { height:88px; padding:0 42px; border-radius:44px; background: var(--surface);
         box-shadow: inset 0 0 0 2px var(--line); font-size:28px;
         display:flex; align-items:center; justify-content:center; }
  .big:active { opacity:.7; }

  /* ---------- parent settings ---------- */
  .pgrid { flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; grid-gap:14px 34px; align-content:start; }
  .field { display:flex; flex-direction:row; align-items:center; justify-content:space-between; }
  .field span { font-size:22px; color: var(--soft); flex:0 0 auto; margin-right:14px; }
  .field input[type=text], .field input[type=time] {
    flex:1 1 auto; min-width:0; height:56px; padding:0 16px; box-sizing:border-box; font-size:24px;
    background: var(--surface); border:0; box-shadow: inset 0 0 0 2px var(--line); border-radius:14px;
    -webkit-user-select:text; user-select:text;
  }
  .toggle { width:104px; height:56px; border-radius:28px; background: var(--line); position:relative; flex:0 0 auto; }
  .toggle b { position:absolute; top:6px; left:6px; width:44px; height:44px; border-radius:22px;
              background: var(--surface); transition: left 200ms ease; }
  .toggle.on { background: var(--accent); }
  .toggle.on b { left:54px; }
  .pnote { flex:0 0 auto; font-size:19px; color: var(--soft); margin-top:12px; line-height:1.5; }

  /* ---------- dad dashboard ---------- */
  .todash { flex:0 0 auto; margin-left:22px; height:38px; padding:0 16px; border-radius:19px;
            color: var(--soft); font-size:19px; opacity:.5;
            display:flex; align-items:center; justify-content:center; box-shadow: inset 0 0 0 1px var(--line); }
  .todash:active { opacity:.85; }
  .dash { position:fixed; top:0; left:0; right:0; bottom:0; background: var(--bg);
          display:flex; flex-direction:column; padding:22px 56px 18px 30px; box-sizing:border-box; }
  .dbody { flex:1 1 auto; display:grid; grid-template-columns: 1.5fr 1fr; grid-gap:18px; min-height:0; }
  .panel { background: var(--surface); border-radius:26px; padding:22px 24px 18px 24px; box-sizing:border-box;
           box-shadow: 0 6px 16px rgba(60,48,36,.07); display:flex; flex-direction:column; min-height:0; }
  .ptitle { flex:0 0 auto; font-size:17px; letter-spacing:1.4px; text-transform:uppercase;
            color: var(--soft); margin:0 0 12px 0; font-weight:600; }
  .ptitle.tomorrow { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .trow { display:grid; grid-template-columns: 118px 1fr 50px 130px; grid-gap:10px; align-items:center; }
  .thead { font-size:16px; letter-spacing:1.2px; text-transform:uppercase; color: var(--soft);
           padding-bottom:8px; border-bottom:1px solid var(--line); }
  .tbody { flex:1 1 auto; }
  .tbody .trow { height:72px; border-bottom:1px solid var(--line); }
  .tbody .trow:last-child { border-bottom:0; }
  .tstd { font-size:36px; font-weight:600; letter-spacing:-0.5px; font-variant-numeric: tabular-nums; }
  .tdest { font-size:20px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tdest.other { color: var(--soft); }
  .tdest.lon { font-weight:600; }
  .tnote { flex:0 0 auto; font-size:18px; color: var(--soft); line-height:1.35; padding-bottom:10px; }
  .tbody.dense { overflow:hidden; }
  .tbody.dense .trow { height:40px; }
  .tbody.dense .tstd { font-size:26px; }
  .tbody.dense .tdest { font-size:18px; }
  .tbody.dense .tplat { font-size:19px; }
  .tbody.dense .tstat { font-size:18px; }
  .tbody.dense .tstat .exp { font-size:21px; }
  .tplat { font-size:24px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .tstat { font-size:21px; }
  .tstat .quiet { color: var(--soft); }
  .tstat .exp { font-size:26px; font-weight:600; font-variant-numeric: tabular-nums; }
  .tstat .was { color: var(--soft); text-decoration: line-through; margin-left:8px; font-size:20px; }
  .off { opacity:.45; }
  .off .tstd { text-decoration: line-through; }
  .freshness { flex:0 0 auto; font-size:17px; color: var(--soft); padding-top:10px; margin-top:auto; }
  .wxgrid { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; grid-gap:16px; }
  .wx { display:flex; flex-direction:column; }
  .wxname { font-size:19px; font-weight:600; margin-bottom:10px; }
  .wxtop { display:flex; flex-direction:row; align-items:center; margin-bottom:8px; }
  .wxtemp { font-size:52px; font-weight:600; letter-spacing:-2px; font-variant-numeric: tabular-nums; }
  .wxtemp.small { font-size:34px; letter-spacing:-1px; }
  .wxicon { color: var(--soft); margin-right:10px; flex:0 0 auto; }
  .wxcond { font-size:19px; color: var(--soft); margin-bottom:12px; }
  .wxhl { font-size:20px; font-variant-numeric: tabular-nums; margin-bottom:12px; }
  .wxhl b { font-weight:600; }
  .wxhl span { color: var(--soft); margin-left:10px; }
  .wxrain { font-size:19px; line-height:1.35; margin-top:8px; padding-top:10px; border-top:1px solid var(--line); }
  .wxrain b { font-weight:600; }
  .wxrain .quiet { color: var(--soft); }
  .unavail { flex:1 1 auto; display:flex; align-items:center; justify-content:center;
             color: var(--soft); font-size:20px; text-align:center; line-height:1.5; padding:0 20px; }
  .dfoot { flex:0 0 auto; display:flex; flex-direction:row; align-items:center; justify-content:space-between;
           margin-top:14px; height:44px; }
  .dback { height:44px; padding:0 22px; border-radius:22px; color: var(--ink); font-size:21px;
           box-shadow: inset 0 0 0 1px var(--line); display:flex; align-items:center; }
  .dback:active { opacity:.6; }

  /* ================= warm, elevated ================= */
  body.t-sand { --bg:#f0e8dd; }
  body.t-sage  { --bg:#e7ece3; }
  body.t-blue  { --bg:#e6ecf1; }
  body.t-lilac { --bg:#ebe6f0; }
  body.t-pink  { --bg:#f0e2e6; }
  .card {
    background: var(--surface); border-radius:44px; padding:26px 70px 30px 70px;
    box-shadow: 0 14px 34px rgba(60,48,36,.09), 0 2px 4px rgba(60,48,36,.05);
    position:relative;
  }
  /* kit stickers: peel-off labels slapped on the corners of the dressing card */
  .sticker { position:absolute; top:-22px; padding:10px 22px 12px 22px; border-radius:26px;
             font-size:25px; font-weight:700; letter-spacing:-0.3px; color:#fff;
             box-shadow:0 6px 14px rgba(60,48,36,.22); white-space:nowrap; }
  .sticker i { display:block; font-style:normal; font-size:15px; font-weight:600;
               letter-spacing:1.6px; text-transform:uppercase; opacity:.75; margin-bottom:1px; }
  .sticker.pe   { left:-26px; background:#5f88a8; -webkit-transform:rotate(-9deg); transform:rotate(-9deg); }
  .sticker.swim { right:-26px; background:#4f9a95; -webkit-transform:rotate(8deg); transform:rotate(8deg); }
  .medallion { width:176px; height:176px; border-radius:88px; box-shadow:none; }
  .medallion .art { width:132px; height:132px; }
  .steplabel { font-size:46px; margin:16px 0 14px 0; }
  .done {
    width:430px; height:132px; border-radius:66px; background: var(--accent);
    color: var(--surface); box-shadow: 0 8px 18px rgba(60,48,36,.16); font-size:38px;
  }
  .park { box-shadow:none; background: transparent; }
  .row { box-shadow: 0 6px 16px rgba(60,48,36,.07); margin-bottom:6px; height:86px; }
  .big { box-shadow: 0 6px 16px rgba(60,48,36,.09); }
  .track { background: rgba(0,0,0,.07); }

  /* ---------- hidden menu rail ---------- */
  .menuhandle { position:fixed; right:0; top:50%; margin-top:-44px; width:44px; height:88px;
                border-radius:22px 0 0 22px; background:var(--surface); color:var(--soft);
                box-shadow:0 6px 16px rgba(60,48,36,.12); opacity:.75; z-index:60;
                display:flex; align-items:center; justify-content:center; }
  .menuhandle:active { opacity:1; }
  .scrim { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.12); z-index:55; }
  .rail { position:fixed; top:0; right:0; bottom:0; width:172px; background:var(--surface);
          box-shadow:-10px 0 30px rgba(60,48,36,.16); z-index:56;
          display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .mitem { width:148px; height:104px; border-radius:20px; margin:5px 0; color:var(--soft);
           display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .mitem.cur { background:var(--bg); color:var(--ink); }
  .mitem:active { opacity:.6; }
  .mitem span { font-size:16px; margin-top:6px; }

  /* ---------- weekly schedule pages ---------- */
  .wkpage { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg);
            display:flex; flex-direction:column; padding:24px 56px 14px 34px; box-sizing:border-box; }
  .wkgrid { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:repeat(5,1fr);
            grid-gap:14px; padding:12px 0 6px 0; }
  .wkcol { background:var(--surface); border-radius:22px; padding:16px 14px; box-sizing:border-box;
           display:flex; flex-direction:column; box-shadow:0 4px 10px rgba(60,48,36,.05); }
  .wkcol.today { box-shadow:0 14px 30px rgba(60,48,36,.16); margin:-10px -3px; padding:20px 16px; }
  .wkday { flex:0 0 auto; font-size:21px; font-weight:600; margin-bottom:6px; }
  .wkcol.today .wkday { color:var(--accent); font-size:23px; }
  .wkrow { flex:1 1 0; display:flex; flex-direction:row; align-items:flex-start;
           padding:12px 0; border-bottom:1px solid var(--line); }
  .wkrow.last { border-bottom:0; }
  .wkrow svg { flex:0 0 auto; margin:2px 9px 0 0; color:var(--soft); }
  .wkval { font-size:17px; line-height:1.25; }
  .wkcol.today .wkval { font-size:18px; }
  .wkval.muted { color:var(--soft); }
  .wknote { font-size:14px; color:var(--soft); margin-top:3px; }

  /* ---------- tabbed setup ---------- */
  .tabs { flex:0 0 auto; display:flex; flex-direction:row; margin-bottom:14px; }
  .tab { height:52px; padding:0 18px; border-radius:26px; margin-right:8px; font-size:19px;
         color:var(--soft); box-shadow:inset 0 0 0 2px var(--line); }
  .tab.on { background:var(--accent); color:var(--surface); box-shadow:none; }
  .scroll { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .tgrid { display:grid; grid-template-columns:104px 1fr 1fr 52px 52px 176px; grid-gap:10px 12px; align-items:center; }
  .wgrid { display:grid; grid-template-columns:104px 186px 1fr 1fr; grid-gap:10px 12px; align-items:center; }
  .th { font-size:15px; letter-spacing:1px; text-transform:uppercase; color:var(--soft); }
  .dayname { font-size:20px; color:var(--soft); }
  .tgrid input[type=text], .wgrid input[type=text] {
    width:100%; height:52px; padding:0 12px; box-sizing:border-box; font-size:20px;
    background:var(--surface); border:0; box-shadow:inset 0 0 0 2px var(--line); border-radius:12px;
    -webkit-user-select:text; user-select:text;
  }
  .cb { width:44px; height:44px; margin:0; border-radius:12px; background:var(--surface);
        box-shadow:inset 0 0 0 2px var(--line); }
  .cb:checked { background:var(--accent); box-shadow:none; }
  .seg { display:flex; flex-direction:row; }
  .segb { height:44px; padding:0 15px; font-size:17px; color:var(--soft); box-shadow:inset 0 0 0 2px var(--line); }
  .segb:first-child { border-radius:22px 0 0 22px; }
  .segb:last-child { border-radius:0 22px 22px 0; }
  .segb.on { background:var(--accent); color:var(--surface); box-shadow:none; }
  .weekbar { display:flex; flex-direction:row; align-items:center; justify-content:space-between; margin:2px 0 14px 0; }
  .weekbar .wklabel { font-size:20px; color:var(--soft); }
  .smallbtn { height:52px; padding:0 22px; border-radius:26px; background:var(--surface);
              box-shadow:inset 0 0 0 2px var(--line); font-size:19px; }
  .smallbtn:active { opacity:.6; }
  .iogrid { display:grid; grid-template-columns:1fr 1fr; grid-gap:20px; margin-top:20px; }
  .iolabel { font-size:17px; color:var(--soft); margin-bottom:8px; }
  .jsonbox { width:100%; height:130px; box-sizing:border-box; padding:10px 12px; border:0; resize:none;
             font:14px/1.4 Menlo, monospace; color:var(--ink); background:var(--surface);
             box-shadow:inset 0 0 0 2px var(--line); border-radius:14px;
             -webkit-user-select:text; user-select:text; }
  .iogrid .smallbtn { margin-top:10px; }

  .fadein { animation: fi 240ms ease both; }
  @keyframes fi { from { opacity:0 } to { opacity:1 } }
  .celebrate { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center;
               justify-content:center; color: var(--accent); opacity:0; transition: opacity 200ms ease; }
  .celebrate.show { opacity:1; }

  @media (prefers-reduced-motion: reduce) {
    .stage, .fill, .done, .park, .toggle b, .celebrate { transition-duration: 0ms !important; }
    .fadein { animation-duration: 0ms; }
  }
</style>
</head>
<body class="t-sand">
<div id="app"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------------- config */
  var STORE_KEY = 'morning.routine.v1';
  var ACTIVE_PROFILE = 'her';          // adding a second profile = data change only
  var WINDOW_MIN = 45;                 // how long before leave time the bar starts depleting
  var BUFFER_MIN = 5;                  // invisible buffer: target is 5 min earlier than entered
  var THEMES = [
    { id: 'sand',  swatch: '#d8c3aa' },
    { id: 'sage',  swatch: '#a9c0a3' },
    { id: 'blue',  swatch: '#a5bccd' },
    { id: 'lilac', swatch: '#bfb2d2' },
    { id: 'pink',  swatch: '#dbb7c2' }
  ];
  // Each step carries its own soft pastel, so the screens are told apart by colour as well as art.
  var STEPS = [
    { id: 'breakfast', label: 'Breakfast',   tint: '#e6d3b9' },
    { id: 'teeth',     label: 'Brush teeth', tint: '#cbdae2' },
    { id: 'hair',      label: 'Brush hair',  tint: '#dcd2e5' },
    { id: 'dressed',   label: 'Get dressed', tint: '#d2e0cf' },
    { id: 'socks',     label: 'Socks on',    tint: '#eed8cb' },
    { id: 'shoes',     label: 'Shoes on',    tint: '#dcd8ce' }
  ];

  /* ---- school schedules: two children, term pattern + weekly overrides ---- */
  var ROUTINE_CHILD = 'tess';          // whose schedule feeds the routine's kit steps
  var CHILDREN = [
    { key: 'tess', name: 'Tess' },
    { key: 'tom',  name: 'Tom' }
  ];

      celebrate: true,
      labels: {},
      day: null
    };
  }
  function profile() { return data.profiles[ACTIVE_PROFILE]; }

  function dateKey() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  function esc(s) {
    if (typeof s !== 'string') return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ------------------------------------------- school schedules: accessors */
  function blankTermDay() {
    return { beforeSchool: '', afterSchool: '', pe: false, swimming: false, defaultLunch: 'school' };
  }
  function ensureSchedules() {
    if (!data.schedules || typeof data.schedules !== 'object') { data.schedules = {}; }
    for (var i = 0; i < CHILDREN.length; i++) {
      var c = data.schedules[CHILDREN[i].key];
      if (!c || typeof c !== 'object') { c = data.schedules[CHILDREN[i].key] = {}; }
      if (!c.term || typeof c.term !== 'object') { c.term = {}; }
      for (var j = 0; j < DAYS.length; j++) {
        if (!c.term[DAYS[j]] || typeof c.term[DAYS[j]] !== 'object') { c.term[DAYS[j]] = blankTermDay(); }
      }
      if (!c.weeks || typeof c.weeks !== 'object') { c.weeks = {}; }
    }
  }
  function schedules() { ensureSchedules(); return data.schedules; }

  // The week on show: Mon-Fri of the current week; from Saturday it rolls
  // forward to the coming week, which is the one being prepared.
  function weekMondayDate() {
    var d = new Date();
    var dow = d.getDay();                          // 0 Sun .. 6 Sat
    var shift = (dow === 0) ? 1 : (dow === 6) ? 2 : (1 - dow);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + shift);
  }
  function isoOf(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }
  function weekKey() { return isoOf(weekMondayDate()); }
  function prevWeekKey() {
    var m = weekMondayDate();
    m.setDate(m.getDate() - 7);
    return isoOf(m);
  }
  function weekLabel() {
    var m = weekMondayDate();
    return 'Week beginning ' + m.getDate() + ' ' + MONTHS[m.getMonth()];
  }
  function termDay(child, di) {
    var s = schedules()[child];
    return (s && s.term && s.term[DAYS[di]]) ? s.term[DAYS[di]] : blankTermDay();
  }
  function weekDayRaw(child, dayId) {
    var s = schedules()[child];
    if (!s || !s.weeks) return null;
    var w = s.weeks[weekKey()];
    if (!w || typeof w !== 'object') return null;
    return (w[dayId] && typeof w[dayId] === 'object') ? w[dayId] : null;
  }
  function weekDay(child, di) { return weekDayRaw(child, DAYS[di]) || {}; }
  function termDayW(child, dayId) {
    ensureSchedules();
    var c = data.schedules[child];
    if (!c.term[dayId] || typeof c.term[dayId] !== 'object') { c.term[dayId] = blankTermDay(); }
    return c.term[dayId];
  }
  function weekDayW(child, dayId) {
    ensureSchedules();
    var c = data.schedules[child];
    var wk = weekKey();
    if (!c.weeks[wk] || typeof c.weeks[wk] !== 'object') { c.weeks[wk] = {}; }
    if (!c.weeks[wk][dayId] || typeof c.weeks[wk][dayId] !== 'object') { c.weeks[wk][dayId] = {}; }
    return c.weeks[wk][dayId];
  }
  // The single truth a day is displayed from: week override, else term, else "normal".
  function resolveDay(child, di) {
    var t = termDay(child, di), w = weekDay(child, di);
    return {
      before: str(t.beforeSchool) || '',
      after: str(w.override) || str(t.afterSchool) || '',
      pe: t.pe === true,
      swimming: t.swimming === true,
      lunch: (w.lunch === 'packed' || w.lunch === 'school') ? w.lunch :
             ((t.defaultLunch === 'packed') ? 'packed' : 'school'),
      lunchNote: str(w.lunchNote) || ''
    };
  }
  function todayIdx() {
    var dow = (new Date()).getDay();
    return (dow >= 1 && dow <= 5) ? dow - 1 : null;
  }

  /* ------------------------------------ kit steps fed from today's schedule */
  function isKitId(id) {
    if (RETIRED_STEPS.indexOf(id) !== -1) return true;
    for (var i = 0; i < EXTRA_STEPS.length; i++) { if (EXTRA_STEPS[i].id === id) return true; }
    return false;
  }
  function kitIdsToday(child) {
    var di = todayIdx();
    if (di === null) return [];                    // weekends carry no kit
    var r = resolveDay(child, di), out = [];
    if (r.swimming) { out.push('kitswim'); }
    if (r.lunch === 'packed') { out.push('kitlunch'); }
    return out;
  }
  // Reconcile today's queue after a schedule edit: add what now applies,
  // remove what no longer does. Ordinary steps are untouched.
  function syncKitSteps() {
    var p = profile();
    if (!p || !p.day || !p.day.queue) return;
    var want = kitIdsToday(ROUTINE_CHILD), i;
    var nq = [];
    for (i = 0; i < p.day.queue.length; i++) {
      var id = p.day.queue[i];
      if (!isKitId(id) || want.indexOf(id) !== -1) { nq.push(id); }
    }
    for (i = 0; i < want.length; i++) {
      if (nq.indexOf(want[i]) === -1) {
        var at = nq.indexOf('shoes');
        if (at === -1) { at = nq.length; }
        nq.splice(at, 0, want[i]);
      }
    }
    p.day.queue = nq;
    p.day.completed = p.day.completed.filter(function (id2) { return nq.indexOf(id2) !== -1; });
  }

  function boot() {
    var cached = readTrainCache();      // board on screen immediately, refreshed after
    if (cached) { trainLive.data = boardFrom(cached.data); trainLive.fetchedAt = cached.fetchedAt; }
    var wxc = readWeatherCache();
    if (wxc) {
      for (var k = 0; k < LOCATIONS.length; k++) {
        var key = LOCATIONS[k].key, hit = wxc[key];
        if (hit && hit.data && typeof hit.fetchedAt === 'number') {
          var slot = wxSlot(key);
          slot.data = weatherFrom(hit.data);
          slot.fetchedAt = hit.fetchedAt;
        }
      }
    }
    var stored = readStore();
    if (!stored || !stored.profiles || !stored.profiles[ACTIVE_PROFILE]) {
      data = { profiles: {} };
      data.profiles[ACTIVE_PROFILE] = defaultProfile();
    } else {
      data = stored;
      var p = data.profiles[ACTIVE_PROFILE];
      var d = defaultProfile();
      for (var k in d) {
        if (k !== 'day' && (typeof p[k] === 'undefined' || p[k] === null)) { p[k] = d[k]; }
      }
    }
    ensureSchedules();
    newDayIfNeeded();
    syncKitSteps();
    writeStore();
  }

  // Daily reset: yesterday is never shown or referenced.
  function newDayIfNeeded() {
    var p = profile();
    if (!p.day || p.day.date !== dateKey()) {
      var base = p.order.filter(function (id) { return !isKitId(id); });
      var kits = kitIdsToday(ROUTINE_CHILD);
      var at = base.indexOf('shoes');
      if (at === -1) { at = base.length; }
      p.day = { date: dateKey(), queue: base.slice(0, at).concat(kits).concat(base.slice(at)), completed: [] };
      writeStore();
    }
  }

  function stepDef(id) {
    var i;
    for (i = 0; i < STEPS.length; i++) { if (STEPS[i].id === id) return STEPS[i]; }
    for (i = 0; i < EXTRA_STEPS.length; i++) { if (EXTRA_STEPS[i].id === id) return EXTRA_STEPS[i]; }
    return STEPS[0];
  }
  function labelOf(id) {
    var p = profile();
    return (p.labels && p.labels[id]) ? p.labels[id] : stepDef(id).label;
  }
  function isDone(id) { return profile().day.completed.indexOf(id) !== -1; }
  function pending() {
    return profile().day.queue.filter(function (id) { return !isDone(id); });
  }
  function currentId() { var q = pending(); return q.length ? q[0] : null; }
  function nextId() { var q = pending(); return q.length > 1 ? q[1] : null; }

  function complete(id) {
    var p = profile();
    if (!isDone(id)) { p.day.completed.push(id); }
    writeStore();
  }
  // Park: move to the end of the queue. No flag, no marker — it comes back looking new.
  function park(id) {
    var p = profile();
    var q = p.day.queue.filter(function (x) { return x !== id; });
    q.push(id);
    p.day.queue = q;
    writeStore();
  }

  /* ------------------------------------------------------------ ambient bar */
  function remainingFraction() {
    var p = profile();
    var parts = (p.leaveTime || '08:20').split(':');
    var target = (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10) - BUFFER_MIN;
    var now = new Date();
    var mins = now.getHours() * 60 + now.getMinutes() + (now.getSeconds() / 60);
    var left = target - mins;
    if (left <= 0) return 1;            // target passed: bar sits full and calm. Nothing happens.
    if (left >= WINDOW_MIN) return 1;
    return left / WINDOW_MIN;
  }

  /* ----------------------------------------------------------------- render */
  var view = 'step';                    // 'step' | 'all' | 'parent' | 'dash'
  var app = document.getElementById('app');

  function ambientHTML() {
    var f = Math.round(remainingFraction() * 1000) / 10;
    return '<div class="ambient">' +
      '<div class="track"><div class="fill" id="fill" style="width:' + f + '%"></div></div>' +
      '<div class="door">' + art('door', 34) + '</div>' +
      '<button class="todash" data-act="dash">Today</button>' +
    '</div>';
  }

  function dotsHTML() {

      '</div><div class="next">Have a good day.</div></div>';

      if (sdi !== null && resolveDay(ROUTINE_CHILD, sdi).pe === true) {

      if (kit.indexOf('kitswim') !== -1) {

  function allHTML() {
    var p = profile(), rows = '';

        '<div class="rl">' + labelOf(id) + '</div>' +
        '<button class="arrow" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>' + art('up', 40) + '</button>' +
        '<button class="arrow" data-act="down" data-i="' + i + '"' + (i === p.day.queue.length - 1 ? ' disabled' : '') + '>' + art('down', 40) + '</button>' +
      '</div>';

            THEMES[t].id + '"><i style="background:' + THEMES[t].swatch + '"></i></button>';
    }
    return '<div class="sheet fadein">' +
      '<h1 class="sheettitle">Your morning</h1>' +
      '<div class="rows">' + rows + '</div>' +
      '<div class="sheetfoot"><div class="themes">' + sw + '</div>' +
      '<button class="big" data-act="back">Back</button></div>' +
    '</div>';
  }

  var setupTab = 'general';
  function setupHTML() {

      '<h1 class="sheettitle">Setup</h1>' +
      '<div class="tabs">' + th + '</div>' +

        '<button class="big" data-act="back">Done</button>' +
      '</div>' +
    '</div>';
  }

  function generalTabHTML() {

      fields += '<div class="field"><span>' + (i + 1) + '</span>' +
        '<input type="text" data-label-for="' + STEPS[i].id + '" value="' + esc(labelOf(STEPS[i].id)) + '"></div>';
    }
    var json = '';
    try { json = JSON.stringify(data); } catch (e) {}
    return '<div class="pgrid">' +
        '<div class="field"><span>Leave time</span><input type="time" id="leave" value="' + p.leaveTime + '"></div>' +
        '<div class="field"><span>Gentle completion feedback</span>' +
          '<button class="toggle' + (p.celebrate ? ' on' : '') + '" data-act="celeb"><b></b></button></div>' +
        fields +
      '</div>' +
      '<div class="pnote">Target is treated as ' + BUFFER_MIN + ' minutes earlier than entered, as invisible buffer. ' +

      '<div style="margin-top:18px"><button class="smallbtn" data-act="resetday">Reset today</button></div>' +
      '<div class="iogrid">' +
        '<div><div class="iolabel">Export settings \u2014 copy this somewhere safe</div>' +
          '<textarea class="jsonbox" id="exp" readonly>' + esc(json) + '</textarea></div>' +

          '<button class="smallbtn" data-act="import">Replace settings</button></div>' +

  }

  function segHTML(act, ref, val) {

      '<button class="segb' + (val === 'school' ? ' on' : '') + '" data-act="' + act + '" data-ref="' + ref + '" data-val="school">School</button>' +

    '</div>';
  }
  function termTabHTML(child) {
    var rows = '<div class="th"></div><div class="th">Before school</div><div class="th">After school</div>' +
      '<div class="th">PE</div><div class="th">Swim</div><div class="th">Default lunch</div>';
    for (var i = 0; i < DAYS.length; i++) {
      var t = termDay(child, i);
      var ref = child + '|' + DAYS[i];
      rows += '<div class="dayname">' + DAY_NAMES[i] + '</div>' +
        '<input type="text" data-term-before="' + ref + '" value="' + esc(t.beforeSchool || '') + '" placeholder="Normal time">' +
        '<input type="text" data-term-after="' + ref + '" value="' + esc(t.afterSchool || '') + '" placeholder="Normal time">' +
        '<input type="checkbox" class="cb" data-term-pe="' + ref + '"' + (t.pe === true ? ' checked' : '') + '>' +
        '<input type="checkbox" class="cb" data-term-swim="' + ref + '"' + (t.swimming === true ? ' checked' : '') + '>' +

  /* ------------------------------------------------- weekly schedule pages */

        '<div class="wkrow">' + wkicon('after') + '<div class="wkval' + (r.after ? '' : ' muted') + '">' + (r.after ? esc(r.after) : 'Normal time') + '</div></div>' +
        '<div class="wkrow last">' + wkicon('kit') + '<div class="wkval' + ((r.pe || r.swimming) ? '' : ' muted') + '">' + kit + '</div></div>' +

  /* --------------------------------------------------- hidden menu rail */
  var menuOpen = false;
  var MICONS = {
    handle: '<path d="M14 13h12M14 20h12M14 27h12"/>',
    routine: '<circle cx="20" cy="20" r="12"/><path d="M14 20l4 4 8-9"/>',

    dash: '<rect x="10" y="7" width="20" height="22" rx="6"/><path d="M10 20h20M15 33l-3 4M25 33l3 4"/><circle cx="15.5" cy="24.5" r="1.4" fill="currentColor"/><circle cx="24.5" cy="24.5" r="1.4" fill="currentColor"/>',
    setup: '<path d="M10 14h20M10 26h20"/><circle cx="17" cy="14" r="3.6"/><circle cx="25" cy="26" r="3.6"/>'
  };
  function micon(name, size) {

  function menuHTML() {

    var items = [
      { v: 'step',      l: 'Routine',          ic: 'routine' },

      rows += '<button class="mitem' + (cur ? ' cur' : '') + '" data-act="nav" data-view="' + items[i].v + '">' +
        micon(items[i].ic, 32) + '<span>' + items[i].l + '</span></button>';
    }
    return '<div class="scrim" data-act="menu"></div><div class="rail fadein">' + rows + '</div>';
  }

  /* -------------------------------------------------------- dad dashboard */
  function statusCell(svc) {
    if (!svc) return '<span class="quiet">—</span>';
    var etd = str(svc.etd);
    if (svc.isCancelled === true || etd === 'Cancelled') {
      return '<span class="quiet">Cancelled</span>';
    }
    if (isTimeLike(etd)) {
      return '<span class="exp">' + etd + '</span><span class="was">' + (str(svc.std) || '') + '</span>';
    }
    if (etd === 'Delayed') { return 'Delayed'; }
    return '<span class="quiet">' + (etd || 'On time') + '</span>';
  }

  /* Board is unfiltered \u2014 all departures from LES, both directions. We prefer the
     London-bound ones, and fall back to everything rather than go blank. */
  function isLondonBound(svc) {
    return destOf(svc) === DEST_NAME;
  }
  function selectServices(feed) {
    var out = { list: [], fallback: false };
    if (!feed || !feed.ok || !feed.data) return out;
    var svcs = feed.data.trainServices;
    if (!svcs || !svcs.length) return out;
    var london = [], i;
    for (i = 0; i < svcs.length; i++) {
      if (svcs[i] && isLondonBound(svcs[i])) { london.push(svcs[i]); }
    }
    if (london.length) { out.list = london; return out; }
    for (i = 0; i < svcs.length; i++) { if (svcs[i]) { out.list.push(svcs[i]); } }
    out.fallback = out.list.length > 0;
    return out;
  }

  // nrccMessages carry embedded markup; we want the sentence, not the styling.
  function stripTags(s) {
    if (typeof s !== 'string') return null;
    var t = s.replace(/<[^>]*>/g, ' ')
             .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
             .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
             .replace(/\s+/g, ' ');
    t = t.replace(/^\s+/, '').replace(/\s+$/, '');
    return t.length ? t : null;
  }
  function firstNrcc(feed) {
    if (!feed || !feed.ok || !feed.data) return null;
    var msgs = feed.data.nrccMessages;
    if (!msgs || !msgs.length) return null;
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      if (!m) continue;
      var txt = stripTags(typeof m === 'string' ? m : m.message);
      if (txt) return txt;
    }
    return null;
  }

  function panelTitle(fallback) {
    return '<div class="ptitle">' + ORIGIN_NAME +
      (fallback ? ' · all departures' : ' → ' + DEST_NAME + ' · ' + OPERATOR) + '</div>';
  }

  function trainPanelHTML(feed) {
    var head = panelTitle(false);
    if (!feed.ok || !feed.data) {
      return '<div class="panel">' + head +
        '<div class="unavail">' + (feed.loading
          ? 'Fetching departures…'
          : 'Train times aren’t coming through at the moment.<br>Weather is unaffected.') +
        '</div>' +
      '</div>';
    }
    var sel = selectServices(feed);
    var svcs = sel.list;
    var limit = sel.fallback ? 12 : DEPARTURES_SHOWN;
    var rows = '';
    for (var i = 0; i < svcs.length && i < limit; i++) {
      var s = svcs[i];
      if (!s) continue;
      var cancelled = (s.isCancelled === true || str(s.etd) === 'Cancelled');
      var plat = str(s.platform);
      var lon = isLondonBound(s);
      rows += '<div class="trow' + (cancelled ? ' off' : '') + '">' +
        '<div class="tstd">' + (str(s.std) || '—') + '</div>' +
        '<div class="tdest ' + (lon ? 'lon' : 'other') + '">' + (destLabel(s) || '—') + '</div>' +
        '<div class="tplat">' + (plat ? plat : '—') + '</div>' +
        '<div class="tstat">' + statusCell(s) + '</div>' +
      '</div>';
    }
    var notes = '';
    if (sel.fallback) {
      notes += '<div class="tnote" id="fallnote">No direct London services — showing all departures.</div>';
    }
    var nrcc = firstNrcc(feed);
    if (nrcc) { notes += '<div class="tnote">' + nrcc + '</div>'; }
    if (!rows) {
      rows = '<div class="unavail">No departures listed right now.</div>';
    }
    var fresh = feed.stale
      ? 'As of ' + (feed.at || '—') + ' — not refreshed since'
      : 'Updated ' + (feed.at || '—');
    return '<div class="panel">' + panelTitle(sel.fallback) + notes +
      '<div class="trow thead"><div>Departs</div><div>Destination</div><div>Plat</div><div>Status</div></div>' +
      '<div class="tbody' + (sel.fallback ? ' dense' : '') + '">' + rows + '</div>' +
      '<div class="freshness">' + fresh + '</div>' +
    '</div>';
  }

  // Tomorrow's line stays on one row \u2014 two two-line blocks would overflow the panel.
  function rainLine(prob, onset, dayWord, oneLine) {
    if (prob === null) { return '<span class="quiet">Rain chance unknown</span>'; }
    if (prob >= RAIN_LIKELY_PCT) {
      var lead = onset ? 'Rain likely from ' + onset : 'Rain likely ' + dayWord;
      var tail = onset ? Math.round(prob) + '% ' + dayWord : Math.round(prob) + '%, timing unclear';
      if (oneLine) {
        return '<b>' + (onset ? 'Rain from ' + onset : 'Rain likely') + '</b>' +
          '<span class="quiet"> \u00b7 ' + Math.round(prob) + '%</span>';
      }
      return '<b>' + lead + '</b><br><span class="quiet">' + tail + '</span>';
    }
    return '<span class="quiet">Rain unlikely \u00b7 ' + Math.round(prob) + '%</span>';
  }

  // day 0 leads on the current temperature; day 1 has no "current", so it leads
  // on the high. Rain sits directly under the numbers, not pushed to the bottom.
  function wxColumnHTML(name, feed, day) {
    if (!feed.ok || !feed.data) {
      // One location failing must not take the other down with it.
      return '<div class="wx">' +
        '<div class="wxname">' + name + '</div>' +
        '<div class="unavail">' + (feed.loading ? 'Fetching\u2026' : 'No forecast') + '</div>' +
      '</div>';
    }
    var w = feed.data;
    var hi = dailyVal(w, 'temperature_2m_max', day), lo = dailyVal(w, 'temperature_2m_min', day);
    var prob = dailyVal(w, 'precipitation_probability_max', day);
    var onset = rainOnset(w, day);
    var cond = wmo(day ? dailyVal(w, 'weather_code', day) : code(w));
    var dayWord = day ? 'tomorrow' : 'today';
    var lead, sub;
    if (day) {
      lead = (hi === null ? '\u2014' : Math.round(hi) + '\u00b0');
      sub = '<div class="wxhl"><span>overnight ' + (lo === null ? '\u2014' : Math.round(lo) + '\u00b0') + '</span></div>';
    } else {
      var t = temp(w);
      lead = (t === null ? '\u2014' : Math.round(t * 10) / 10 + '\u00b0');
      sub = '<div class="wxcond">' + cond.label + '</div>' +
        '<div class="wxhl"><b>' + (hi === null ? '\u2014' : Math.round(hi) + '\u00b0') + '</b>' +
        '<span>' + (lo === null ? '\u2014' : Math.round(lo) + '\u00b0') + '</span></div>';
    }
    return '<div class="wx">' +
      '<div class="wxname">' + name + '</div>' +
      '<div class="wxtop">' + wxIcon(cond.icon, day ? 32 : 40) +
        '<div class="wxtemp' + (day ? ' small' : '') + '">' + lead + '</div></div>' +
      sub +
      '<div class="wxrain">' + rainLine(prob, onset, dayWord, day ? true : false) + '</div>' +
    '</div>';
  }

  function weatherPanelHTML(feeds) {
    var anyOk = false, anyLoading = false, i;
    for (i = 0; i < feeds.length; i++) {
      if (feeds[i].feed.ok) { anyOk = true; }
      if (feeds[i].feed.loading) { anyLoading = true; }
    }
    if (!anyOk) {
      return '<div class="panel">' + '<div class="ptitle">Today</div>' +
        '<div class="unavail">' + (anyLoading
          ? 'Fetching forecast\u2026'
          : 'Weather isn\u2019t coming through at the moment.<br>Trains are unaffected.') +
        '</div>' +
      '</div>';
    }
    var today = '', tomorrow = '';
    for (i = 0; i < feeds.length; i++) {
      today += wxColumnHTML(feeds[i].name, feeds[i].feed, 0);
      tomorrow += wxColumnHTML(feeds[i].name, feeds[i].feed, 1);
    }
    var at = null, stale = false;
    for (i = 0; i < feeds.length; i++) {
      if (feeds[i].feed.ok) { at = feeds[i].feed.at; stale = feeds[i].feed.stale === true; }
    }
    var fresh = stale ? 'As of ' + (at || '\u2014') + ' \u2014 not refreshed since' : 'Updated ' + (at || '\u2014');
    return '<div class="panel">' +
      '<div class="ptitle">Today</div>' +
      '<div class="wxgrid">' + today + '</div>' +
      '<div class="ptitle tomorrow">Tomorrow</div>' +
      '<div class="wxgrid">' + tomorrow + '</div>' +
      '<div class="freshness">' + fresh + '</div>' +
    '</div>';
  }

  /* The fallback board can be long and the notes above it vary in height, so the
     row count is measured, not assumed — and the note says what is really shown. */
  function fitTrainRows() {
    var tb = document.querySelector('.tbody.dense');
    if (!tb || !tb.children || !tb.children.length) return;
    var first = tb.children[0];
    var rh = first.offsetHeight;
    if (!rh) return;
    var total = tb.children.length;
    var fits = Math.floor(tb.clientHeight / rh);
    if (fits < 1) fits = 1;
    while (tb.children.length > fits) { tb.removeChild(tb.children[tb.children.length - 1]); }
    var note = document.getElementById('fallnote');
    if (note && tb.children.length < total) {
      note.innerHTML = 'No direct London services — showing the next ' + tb.children.length +
        ' of ' + total + ' departures.';
    }
  }

  function dashHTML() {
    var tFeed = trainFeed();
    var wFeeds = [];
    for (var i = 0; i < LOCATIONS.length; i++) {
      wFeeds.push({ name: LOCATIONS[i].name, feed: weatherFeed(LOCATIONS[i].key) });
    }
    return '<div class="dash fadein">' +
      '<div class="dbody">' + trainPanelHTML(tFeed) + weatherPanelHTML(wFeeds) + '</div>' +
      '<div class="dfoot">' +
        '<button class="dback" data-act="back">Back to routine</button>' +
      '</div>' +
    '</div>';
  }

  function render() {
    var p = profile();
    document.body.className = 't-' + (themeOverride || p.theme);
    var html;
    if (view === 'all') { html = allHTML(); }
    else if (view === 'parent') { html = setupHTML(); }
    else if (view === 'dash') { html = dashHTML(); }
    else if (view === 'week-tess') { html = weekPageHTML('tess'); }
    else if (view === 'week-tom') { html = weekPageHTML('tom'); }
    else { html = ambientHTML() + '<div class="stage" id="stage">' + stepPaneHTML() + '</div>' + dotsHTML(); }
    app.innerHTML = html + menuHTML();
    if (view === 'dash') { fitTrainRows(); }
  }

  function advance(mutate) {
    var stage = document.getElementById('stage');
    if (!stage || FADE === 0) { mutate(); render(); return; }
    stage.style.opacity = '0';
    window.setTimeout(function () { mutate(); render(); }, FADE);
  }

  function completeAndAdvance(id) {
    var stage = document.getElementById('stage');
    if (profile().celebrate && stage && FADE > 0) {
      var c = document.createElement('div');
      c.className = 'celebrate';
      c.innerHTML = art('check', 150);
      stage.appendChild(c);
      window.setTimeout(function () { c.className = 'celebrate show'; }, 20);
      window.setTimeout(function () { advance(function () { complete(id); }); }, 300);
    } else {
      advance(function () { complete(id); });
    }
  }

  /* --------------------------------------------- dashboard hands itself back */
  var idleTimer = null;
  var IDLE_VIEWS = { dash: 1, 'week-tess': 1, 'week-tom': 1, all: 1 };
  function armIdle() {
    if (idleTimer) { window.clearTimeout(idleTimer); idleTimer = null; }
    if (!IDLE_VIEWS[view]) return;
    idleTimer = window.setTimeout(function () {
      if (IDLE_VIEWS[view]) { view = 'step'; menuOpen = false; render(); }   // her routine state is untouched
    }, IDLE_RETURN_MS);
  }

  /* ------------------------------------------------------------ interaction */
  document.addEventListener('click', function (e) {
    if (IDLE_VIEWS[view]) { armIdle(); }
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var p = profile();
    if (view === 'parent') { saveSetupFields(); }

    if (act === 'done') { completeAndAdvance(currentId()); return; }
    if (act === 'park') { var id = currentId(); advance(function () { park(id); }); return; }
    if (act === 'all') { view = 'all'; render(); armIdle(); return; }
    if (act === 'menu') { menuOpen = !menuOpen; render(); return; }
    if (act === 'nav') {
      var v = el.getAttribute('data-view');
      menuOpen = false;
      view = v;
      if (v === 'dash') { startTrainPolling(); startWeatherPolling(); }
      render(); armIdle(); return;
    }
    if (act === 'dash') { menuOpen = false; view = 'dash'; render(); armIdle(); startTrainPolling(); startWeatherPolling(); return; }
    if (act === 'back') { view = 'step'; menuOpen = false; render(); armIdle(); return; }
    if (act === 'tab') { setupTab = el.getAttribute('data-tab'); render(); return; }
    if (act === 'tlunch' || act === 'wklunch') {
      var ref = (el.getAttribute('data-ref') || '').split('|');
      if (ref.length === 2) {
        if (act === 'tlunch') { termDayW(ref[0], ref[1]).defaultLunch = el.getAttribute('data-val'); }
        else { weekDayW(ref[0], ref[1]).lunch = el.getAttribute('data-val'); }
        syncKitSteps(); writeStore();
      }
      render(); return;
    }
    if (act === 'copyweek') {
      var ch = el.getAttribute('data-child');
      var s = schedules()[ch];
      var prev = s && s.weeks ? s.weeks[prevWeekKey()] : null;
      if (prev) {
        try { s.weeks[weekKey()] = JSON.parse(JSON.stringify(prev)); } catch (e2) {}
        syncKitSteps(); writeStore(); render();
      }
      return;
    }
    if (act === 'import') { importSettings(); return; }
    if (act === 'theme') { p.theme = el.getAttribute('data-id'); themeOverride = null; writeStore(); render(); return; }
    if (act === 'celeb') { p.celebrate = !p.celebrate; writeStore(); render(); return; }
    if (act === 'resetday') {
      p.day = null;
      newDayIfNeeded();
      writeStore(); view = 'step'; menuOpen = false; render(); return;
    }
    if (act === 'up' || act === 'down') {
      var i = parseInt(el.getAttribute('data-i'), 10);
      var j = act === 'up' ? i - 1 : i + 1;
      var q = p.day.queue;
      if (j < 0 || j >= q.length) return;
      var tmp = q[i]; q[i] = q[j]; q[j] = tmp;
      // Kit steps are day-specific, so they never enter the saved order.
      p.order = q.filter(function (id3) { return !isKitId(id3); });
      writeStore(); render();
    }
  }, false);

  function saveSetupFields() {
    if (view !== 'parent') return;
    var p = profile();
    var t = document.getElementById('leave');
    if (t && t.value) { p.leaveTime = t.value; }
    var i, el, ref, v;
    var labels = document.querySelectorAll('[data-label-for]');
    for (i = 0; i < labels.length; i++) {
      var id = labels[i].getAttribute('data-label-for');
      v = labels[i].value.trim();
      if (v) { p.labels[id] = v; } else { delete p.labels[id]; }
    }
    function refOf(el2, attr) {
      var parts = (el2.getAttribute(attr) || '').split('|');
      return parts.length === 2 ? parts : null;
    }
    var qs = document.querySelectorAll('[data-term-before]');
    for (i = 0; i < qs.length; i++) { el = qs[i]; ref = refOf(el, 'data-term-before'); if (ref) { termDayW(ref[0], ref[1]).beforeSchool = el.value.trim(); } }
    qs = document.querySelectorAll('[data-term-after]');
    for (i = 0; i < qs.length; i++) { el = qs[i]; ref = refOf(el, 'data-term-after'); if (ref) { termDayW(ref[0], ref[1]).afterSchool = el.value.trim(); } }
    qs = document.querySelectorAll('[data-term-pe]');
    for (i = 0; i < qs.length; i++) { el = qs[i]; ref = refOf(el, 'data-term-pe'); if (ref) { termDayW(ref[0], ref[1]).pe = el.checked === true; } }
    qs = document.querySelectorAll('[data-term-swim]');
    for (i = 0; i < qs.length; i++) { el = qs[i]; ref = refOf(el, 'data-term-swim'); if (ref) { termDayW(ref[0], ref[1]).swimming = el.checked === true; } }
    qs = document.querySelectorAll('[data-wk-note]');
    for (i = 0; i < qs.length; i++) {
      el = qs[i]; ref = refOf(el, 'data-wk-note');
      if (!ref) continue;
      v = el.value.trim();
      if (v) { weekDayW(ref[0], ref[1]).lunchNote = v; }
      else { var wd = weekDayRaw(ref[0], ref[1]); if (wd) { delete wd.lunchNote; } }
    }
    qs = document.querySelectorAll('[data-wk-over]');
    for (i = 0; i < qs.length; i++) {
      el = qs[i]; ref = refOf(el, 'data-wk-over');
      if (!ref) continue;
      v = el.value.trim();
      if (v) { weekDayW(ref[0], ref[1]).override = v; }
      else { var wd2 = weekDayRaw(ref[0], ref[1]); if (wd2) { delete wd2.override; } }
    }
    syncKitSteps();
    writeStore();
  }

  function importSettings() {
    var box = document.getElementById('imp');
    var txt = box ? box.value : '';
    txt = txt ? txt.replace(/^\s+/, '').replace(/\s+$/, '') : '';
    if (!txt) return;
    var parsed = null;
    try { parsed = JSON.parse(txt); } catch (e) {}
    if (!parsed || typeof parsed !== 'object' || !parsed.profiles || typeof parsed.profiles !== 'object') {
      window.alert('That doesn\u2019t look like settings from this app.');
      return;
    }
    if (!window.confirm('Replace all settings with the pasted ones? This can\u2019t be undone.')) return;
    data = parsed;
    if (!data.profiles[ACTIVE_PROFILE]) { data.profiles[ACTIVE_PROFILE] = defaultProfile(); }
    var p = data.profiles[ACTIVE_PROFILE], d = defaultProfile(), k;
    for (k in d) {
      if (k !== 'day' && (typeof p[k] === 'undefined' || p[k] === null)) { p[k] = d[k]; }
    }
    ensureSchedules();
    newDayIfNeeded();
    syncKitSteps();
    writeStore();
    render();
  }


  document.addEventListener('touchstart', function () {
    if (IDLE_VIEWS[view]) { armIdle(); }
  }, false);

  // Appliance feel: no rubber-band scrolling, no pinch zoom.
  document.addEventListener('touchmove', function (e) {
    var t = e.target;
    var editable = t && t.closest ? t.closest('input, textarea, .scroll') : null;
    if (!editable) { e.preventDefault(); }
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);

  /* -------------------------------------------------------------- lifecycle */
  boot();
  render();

  window.setInterval(function () {
    var f = document.getElementById('fill');
    if (f) { f.style.width = (Math.round(remainingFraction() * 1000) / 10) + '%'; }
  }, 15000);

  // Left on the counter overnight: pick up the new day on wake, silently.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      var before = profile().day.date;
      newDayIfNeeded();
      syncKitSteps();
      if (profile().day.date !== before) { view = 'step'; menuOpen = false; }
      render();
    }
  }, false);
})();
</script>
</body>
</html>
